name: build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  code:
    name: compile and test samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: verify
        working-directory: code
        run: mvn -B --no-transfer-progress verify

  site:
    name: build site
    needs: code
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install hugo
        run: |
          curl -sSLo hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      # Drafts are excluded from the production build, so a draft post is the one
      # place a broken snippet gets no CI signal until the day it is published.
      # Build with drafts first, to a throwaway directory, purely to run the
      # shortcodes. Errors here fail the job before anything is deployed.
      - name: validate drafts render
        run: hugo -D -d "${RUNNER_TEMP}/draft-check"
      - uses: actions/configure-pages@v5
        id: pages
      - name: build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
