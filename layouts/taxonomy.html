{{ define "main" }}
<section class="index">
  <h1 class="index__title">{{ .Title }}</h1>
  <ol class="postlist">
    {{ range .Pages }}
    <li class="postlist__item">
      <time>{{ len .Pages }} post{{ if ne (len .Pages) 1 }}s{{ end }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ol>
</section>
{{ end }}
