{{- $e := hugo.Data.environment -}}
<div class="env">
  <p class="env__title">Measurement environment</p>
  <dl>
    <dt>CPU</dt><dd>{{ $e.cpu }}</dd>
    <dt>Cores</dt><dd>{{ $e.cores }}</dd>
    <dt>Turbo / C-states</dt><dd>{{ $e.turbo }}</dd>
    <dt>Pinning</dt><dd>{{ $e.pinning }}</dd>
    <dt>OS / kernel</dt><dd>{{ $e.os }}</dd>
    <dt>JDK</dt><dd>{{ $e.jdk }}</dd>
    <dt>JVM flags</dt><dd><code>{{ $e.flags }}</code></dd>
  </dl>
</div>
