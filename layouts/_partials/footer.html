<script>
(function () {
  var root = document.documentElement;
  var btn = document.querySelector('[data-theme-toggle]');

  function stored() {
    try {
      var v = localStorage.getItem('theme');
      return (v === 'light' || v === 'dark') ? v : null;
    } catch (e) { return null; }
  }
  function syncLabel() {
    if (!btn) return;
    var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    btn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
    btn.setAttribute('title', 'Switch to ' + next + ' theme');
  }

  syncLabel();
  if (btn) {
    btn.addEventListener('click', function () {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) { /* private mode */ }
      syncLabel();
    });
  }

  /* Until a choice is actually stored, keep following the system if it flips mid-visit. */
  var mq = matchMedia('(prefers-color-scheme: dark)');
  function follow(e) {
    if (stored()) return;
    root.dataset.theme = e.matches ? 'dark' : 'light';
    syncLabel();
  }
  if (mq.addEventListener) { mq.addEventListener('change', follow); }
  else if (mq.addListener) { mq.addListener(follow); }

  /* Motion is opt-in, and the theme control above must keep working without it. */
  if (root.dataset.motion !== '1') return;
  if (!('IntersectionObserver' in window)) { delete root.dataset.motion; return; }

  var reveal = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('is-in');
      reveal.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('[data-reveal]').forEach(function (el) { reveal.observe(el); });

  /* Stop the hero loop burning cycles once it has scrolled away. */
  var sch = document.querySelector('[data-schematic]');
  if (sch) {
    new IntersectionObserver(function (entries) {
      sch.classList.toggle('is-paused', !entries[0].isIntersecting);
    }).observe(sch);
  }
})();
</script>
