<script>
(function () {
  var root = document.documentElement;
  if (root.dataset.motion !== '1') return;
  if (!('IntersectionObserver' in window)) { delete root.dataset.motion; return; }

  var reveal = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('is-in');
      reveal.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('[data-reveal]').forEach(function (el) { reveal.observe(el); });

  /* Stop the hero loop burning cycles once it has scrolled away. */
  var sch = document.querySelector('[data-schematic]');
  if (sch) {
    new IntersectionObserver(function (entries) {
      sch.classList.toggle('is-paused', !entries[0].isIntersecting);
    }).observe(sch);
  }
})();
</script>
