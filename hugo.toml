baseURL = "https://kafi.dev/"
locale = "en-gb"
title = "Ahmed Kafi"
enableRobotsTXT = true
enableGitInfo = false

# code/ and bench/ live inside the Hugo root so os.ReadFile can reach them
# from the snippet shortcode. They are not content, so Hugo ignores them.

[params]
  tagline = "Low-latency Java, the JVM, and trading systems infrastructure."
  linkedin = "https://linkedin.com/in/ahmed-kafi-9b0877242"
  # github is the profile, linked from the masthead. repo is this repository, and is
  # what snippet.html builds blob links from, so it needs the repo path, not the user.
  github = "https://github.com/AKAFI1"
  repo = "https://github.com/AKAFI1/kafi-blog"
  email = "prokafiahmed@gmail.com"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  lineNos = false
  tabWidth = 4
  guessSyntax = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[taxonomies]
  tag = "tags"

[outputs]
  home = ["html", "rss"]
